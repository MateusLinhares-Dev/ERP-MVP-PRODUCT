<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lançar">
<title>Lançamento rápido · Manuela Metais</title>
<link rel="manifest" href="/rapido/manifest.webmanifest">
<link rel="icon" href="/assets/branding/favicon-256.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/rapido/rapido.css?v=20261109-3">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h9.8a1 1 0 0 0 1-.8L21 7H7"/></symbol>
  <symbol id="i-currency" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 6.5c0-1.7-2.2-3-5-3s-5 1.3-5 3 1.5 2.6 5 3 5 1.3 5 3-2.2 3-5 3-5-1.3-5-3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5h6"/><path d="M9 10h6"/><path d="M9 14h6"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
</svg>

<header class="header">
  <div class="hdr-brand">
    <img class="brand-logo-img" src="/assets/branding/manuela-metais-symbol.png" alt="" onerror="this.hidden=true">
    <div>
      <div class="hdr-logo">Manuela <span>Metais</span></div>
      <div class="hdr-sub">Lançamento rápido</div>
    </div>
  </div>
  <div class="hdr-user">
    <div class="hdr-avatar" id="hdr-avatar" hidden></div>
    <button type="button" class="btn-out" id="btn-sair" hidden>Sair</button>
  </div>
</header>

<main id="app">
  <section id="tela-carregando" class="centro">
    <div class="girando" aria-hidden="true"></div>
    <p id="msg-carregando">Carregando…</p>
  </section>

  <section id="tela-bloqueado" class="centro" hidden>
    <p class="grande-texto" id="msg-bloqueado"></p>
    <button type="button" class="botao secundario" id="btn-bloqueado-sair">Entrar com outro usuário</button>
  </section>

  <section id="tela-inicio" hidden>
    <div class="boas-vindas">
      <div class="bv-avatar" id="bv-avatar" aria-hidden="true"></div>
      <div>
        <h1 class="saudacao">Olá, <span id="nome-usuario"></span>!</h1>
        <p class="subtitulo">O que você quer lançar agora?</p>
      </div>
    </div>
    <div class="acoes">
      <button type="button" class="acao-card" data-novo="compra">
        <span class="acao-icone"><svg><use href="#i-cart"/></svg></span>
        <span class="acao-texto"><strong>Compra</strong><small>Comprei material de um fornecedor</small></span>
        <svg class="acao-seta"><use href="#i-chevron"/></svg>
      </button>
      <button type="button" class="acao-card" data-novo="venda">
        <span class="acao-icone venda"><svg><use href="#i-currency"/></svg></span>
        <span class="acao-texto"><strong>Venda</strong><small>Vendi material para um cliente</small></span>
        <svg class="acao-seta"><use href="#i-chevron"/></svg>
      </button>
    </div>
    <button type="button" class="botao secundario com-icone" data-ir="historico"><svg><use href="#i-list"/></svg>Meus lançamentos</button>
    <a class="link-erp" id="link-erp" href="/?completo=1" hidden>Abrir o sistema completo</a>
  </section>

  <section id="tela-lancamento" hidden>
    <div class="barra-titulo">
      <button type="button" class="voltar" data-ir="inicio" aria-label="Voltar ao início"><svg><use href="#i-back"/></svg>Início</button>
      <h1 class="sec-title" id="titulo-lancamento">Nova compra</h1>
    </div>

    <div class="tcard">
      <div class="tcard-hdr"><span class="tcard-title">Falar o lançamento</span></div>
      <div class="tcard-corpo voz">
        <button type="button" id="btn-falar" class="microfone"><span class="mic-circulo"><svg><use href="#i-mic"/></svg></span><span id="txt-falar">Toque e fale</span></button>
        <p class="dica" id="dica-voz"></p>
        <div class="fg">
          <label for="texto-falado">O que foi entendido (pode escrever ou corrigir)</label>
          <textarea id="texto-falado" rows="3" placeholder="Ou escreva aqui. O microfone do teclado também funciona."></textarea>
        </div>
        <button type="button" id="btn-entender" class="botao primario com-icone"><svg><use href="#i-spark"/></svg>Preencher com o que eu falei</button>
        <div id="duvidas" class="alerta" hidden></div>
      </div>
    </div>

    <div class="tcard">
      <div class="tcard-hdr"><label class="tcard-title" for="busca-parte" id="rotulo-parte">Fornecedor</label></div>
      <div class="tcard-corpo">
        <div id="parte-escolhida" class="escolhido" hidden></div>
        <input id="busca-parte" type="search" placeholder="Toque para ver a lista ou digite o nome" autocomplete="off" enterkeyhint="search">
        <div id="lista-parte" class="lista-opcoes"></div>
      </div>
    </div>

    <div class="tcard">
      <div class="tcard-hdr"><span class="tcard-title">Materiais</span></div>
      <div class="tcard-corpo">
        <div id="itens"></div>
        <button type="button" id="btn-add-item" class="botao secundario">+ Adicionar outro material</button>
      </div>
    </div>

    <div class="tcard">
      <div class="tcard-hdr"><span class="tcard-title">Datas e observação</span></div>
      <div class="tcard-corpo">
        <div class="duas-colunas">
          <div class="fg"><label for="data" id="rotulo-data">Data da compra</label><input type="date" id="data"></div>
          <div class="fg"><label for="vencimento" id="rotulo-venc">Vencimento (pagar até)</label><input type="date" id="vencimento"></div>
        </div>
        <div class="fg" id="campo-nf" hidden><label for="nf">Nota fiscal (opcional)</label><input id="nf" inputmode="numeric" maxlength="40"></div>
        <div class="fg"><label for="observacao">Observação (opcional)</label><textarea id="observacao" rows="2" maxlength="1000"></textarea></div>
      </div>
    </div>

    <div class="tcard">
      <div class="tcard-hdr"><span class="tcard-title">Fotos e arquivos</span><span class="tcard-extra">opcional</span></div>
      <div class="tcard-corpo">
        <div class="duas-colunas">
          <label class="botao secundario arquivo com-icone"><svg><use href="#i-camera"/></svg>Tirar foto<input type="file" id="arq-camera" accept="image/*" capture="environment"></label>
          <label class="botao secundario arquivo com-icone"><svg><use href="#i-clip"/></svg>Foto ou PDF<input type="file" id="arq-galeria" accept="image/*,application/pdf" multiple></label>
        </div>
        <ul id="lista-anexos" class="anexos"></ul>
      </div>
    </div>

    <div class="total-fixo">
      <div class="total-rotulo">Total<strong id="total">R$ 0,00</strong></div>
      <button type="button" id="btn-conferir" class="botao primario confirmar">Conferir e salvar</button>
    </div>
  </section>

  <section id="tela-conferir" hidden>
    <div class="barra-titulo">
      <button type="button" class="voltar" id="btn-voltar-corrigir"><svg><use href="#i-back"/></svg>Corrigir</button>
      <h1 class="sec-title">Está tudo certo?</h1>
    </div>
    <div class="tcard resumo" id="resumo"></div>
    <button type="button" id="btn-salvar" class="botao primario grande com-icone"><svg><use href="#i-check"/></svg>Está certo, SALVAR</button>
    <button type="button" class="botao secundario" id="btn-corrigir">Não, quero corrigir</button>
  </section>

  <section id="tela-sucesso" class="centro" hidden>
    <div class="check" aria-hidden="true"><svg><use href="#i-check"/></svg></div>
    <p class="grande-texto" id="msg-sucesso"></p>
    <p class="subtitulo" id="msg-sucesso-detalhe"></p>
    <button type="button" class="botao primario grande" id="btn-outro">+ Fazer outro lançamento</button>
    <button type="button" class="botao secundario" data-ir="inicio">Voltar ao início</button>
  </section>

  <section id="tela-historico" hidden>
    <div class="barra-titulo">
      <button type="button" class="voltar" data-ir="inicio"><svg><use href="#i-back"/></svg>Início</button>
      <h1 class="sec-title" id="titulo-historico">Meus lançamentos</h1>
    </div>
    <div id="lista-historico"></div>
  </section>
</main>

<div id="visualizador" class="visualizador" hidden>
  <button type="button" class="fechar" id="btn-fechar-visualizador">Fechar</button>
  <img id="img-visualizador" alt="Anexo">
</div>
<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
<script type="module" src="/rapido/rapido.js?v=20261109-3"></script>
</body>
</html>
